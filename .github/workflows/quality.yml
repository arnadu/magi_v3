name: Quality

# The single pipeline. Every gate runs on pull requests and on every push to main; the two deploy
# jobs at the bottom run only on a push to main, only for the paths they own, and only after every
# gate is green — a red lint, test, audit or secret scan can no longer auto-deploy dev.
# Actions are pinned by commit SHA (the tag is in the trailing comment).
#
# The path filter compares against the push's base, so a push whose gates failed leaves its
# changes undeployed until another push touches the same paths — a follow-up that only fixes the
# gate does not redeploy them. `workflow_dispatch` runs every gate on main and then deploys the
# chosen planes regardless of paths: `gh workflow run Quality -f deploy_control=true -f build_execution=true`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_control:
        description: Deploy the control plane (dev) after the gates pass
        type: boolean
        default: true
      build_execution:
        description: Build + pin the execution plane image (dev) after the gates pass
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.filter.outputs.control }}
      execution: ${{ steps.filter.outputs.execution }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        # A dispatch has no base to diff against; the deploy jobs use the inputs instead.
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            # Everything each Dockerfile COPYs, plus the workflow that builds it. A root
            # dependency bump touches only package*.json/patches and must still deploy.
            control:
              - 'packages/control-plane/**'
              - 'packages/agent-config/**'
              - 'packages/agent-runtime-worker/**'
              - 'packages/cockpit/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'tsconfig.base.json'
              - 'fly.control-dev.toml'
              - '.github/workflows/deploy-control-plane.yml'
            execution:
              - 'packages/agent-runtime-worker/**'
              - 'packages/agent-config/**'
              - 'packages/skills/**'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'tsconfig.base.json'
              - '.github/workflows/build-execution-image.yml'

  verify:
    name: Build, lint, tripwires, typecheck, unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify (same script as the local pre-push hook)
        run: npm run verify

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.0
    # Skip on Dependabot PRs — semgrep can't access secrets there
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan packages/
        run: semgrep scan --config p/default packages/ --error --quiet

  dependencies:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run security:deps

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows-and-shell:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
      - name: shellcheck (errors only for now; ratchet to warnings as scripts are touched)
        run: |
          find scripts packages/skills -name '*.sh' -not -path '*/node_modules/*' -print0 \
            | xargs -0 shellcheck -S error

  deploy-control-plane:
    name: Deploy control plane (dev)
    needs: [changes, verify, semgrep, dependencies, secrets, workflows-and-shell]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.control == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_control)
    uses: ./.github/workflows/deploy-control-plane.yml
    secrets: inherit

  build-execution-image:
    name: Build execution plane image (dev)
    # Runs after the control-plane deploy (or its skip): its last step pins FLY_MISSIONS_IMAGE on the
    # control-plane machine, which needs the same machine lease `flyctl deploy` holds — running the
    # two in parallel made the pin fail with "lease currently held" and left the secret staged.
    needs: [changes, verify, semgrep, dependencies, secrets, workflows-and-shell, deploy-control-plane]
    if: >-
      !cancelled() &&
      (needs.deploy-control-plane.result == 'success' || needs.deploy-control-plane.result == 'skipped') &&
      needs.verify.result == 'success' && needs.semgrep.result == 'success' &&
      needs.dependencies.result == 'success' && needs.secrets.result == 'success' &&
      needs.workflows-and-shell.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.execution == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.build_execution))
    uses: ./.github/workflows/build-execution-image.yml
    secrets: inherit
