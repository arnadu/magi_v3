name: Quality

# The single pipeline. Every gate runs on pull requests and on every push to main; the two deploy
# jobs at the bottom run only on a push to main, only for the paths they own, and only after every
# gate is green — a red lint, test, audit or secret scan can no longer auto-deploy dev.
# Actions are pinned by commit SHA (the tag is in the trailing comment).
#
# The path filter compares against the push's base, so a push whose gates failed leaves its
# changes undeployed until another push touches the same paths — a follow-up that only fixes the
# gate does not redeploy them. `workflow_dispatch` runs every gate on main and then deploys the
# chosen planes regardless of paths: `gh workflow run Quality -f deploy_control=true -f build_execution=true`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_control:
        description: Deploy the control plane (dev) after the gates pass
        type: boolean
        default: true
      build_execution:
        description: Build + pin the execution plane image (dev) after the gates pass
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.filter.outputs.control }}
      execution: ${{ steps.filter.outputs.execution }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: filter
        # A dispatch has no base to diff against; the deploy jobs use the inputs instead.
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            # Everything each Dockerfile COPYs, plus the workflow that builds it. A root
            # dependency bump touches only package*.json/patches and must still deploy.
            control:
              - 'packages/control-plane/**'
              - 'packages/agent-config/**'
              - 'packages/agent-runtime-worker/**'
              - 'packages/cockpit/**'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'tsconfig.base.json'
              - 'fly.control-dev.toml'
              - 'fly.apps-dev.toml'
              - '.github/workflows/deploy-control-plane.yml'
            execution:
              - 'packages/agent-runtime-worker/**'
              - 'packages/agent-config/**'
              - 'packages/skills/**'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'tsconfig.base.json'
              - '.github/workflows/build-execution-image.yml'

  verify:
    name: Build, lint, tripwires, typecheck, unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify (same script as the local pre-push hook)
        run: npm run verify

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.0
    # Skip on Dependabot PRs — semgrep can't access secrets there
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Our rules (scripts/security/semgrep/): each must still catch its planted cases before
      # its silence on the code means anything.
      - name: Our rules catch their planted cases
        run: |
          for rule in scripts/security/semgrep/*.yml; do
            semgrep --test --config "$rule" "${rule%.yml}.ts"
          done
      - name: Scan packages/ (registry defaults and our rules)
        run: semgrep scan --config p/default --config scripts/security/semgrep/ packages/ --error --quiet

  dependencies:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run security:deps

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows-and-shell:
    name: actionlint, zizmor, shellcheck, Dockerfile config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
      - name: shellcheck (errors only for now; ratchet to warnings as scripts are touched)
        run: |
          find scripts packages/skills -name '*.sh' -not -path '*/node_modules/*' -print0 \
            | xargs -0 shellcheck -S error
      - name: zizmor (workflow security, medium and above)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet zizmor==1.32.0
          zizmor --min-severity medium .github/workflows
      - name: trivy config (Dockerfiles, medium and above)
        run: |
          TRIVY="$(bash scripts/security/install-trivy.sh)"
          for f in packages/agent-runtime-worker/Dockerfile packages/control-plane/Dockerfile; do
            "$TRIVY" config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL "$f"
          done

  data-factory-python:
    name: data-factory Python tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: pytest (network-dependent adapter tests excluded)
        run: |
          python3 -m pip install --quiet pytest==9.1.1
          cd tests/data_factory
          python3 -m pytest -q test_process_news.py test_refresh.py test_catalog.py \
            -k "not yfinance and not invalid_ticker"

  trace:
    # Report-only (ADR-0036): the CodeQL trace joined to the baseline catalog. No deploy job
    # needs it, and it fails only when the tool itself breaks, never on what it finds. It runs
    # the repository's code, so it holds no write access to the repository: the reports reach
    # the `trace` branch through `trace-publish`. Security results go only to code scanning.
    name: Trace (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache CodeQL
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/magi/codeql
          key: codeql-${{ hashFiles('scripts/trace/install-codeql.sh') }}
      - name: Install CodeQL (pinned version, checksum verified)
        run: bash scripts/trace/install-codeql.sh
      - name: The previous scan, so new findings are marked
        run: |
          mkdir -p analysis
          if git fetch --quiet --depth=1 origin trace; then
            git show FETCH_HEAD:findings.json > analysis/findings.json || rm -f analysis/findings.json
          fi
      - name: Trace
        run: npm run trace
      - name: Security results to code scanning (maintainers only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: analysis/security.sarif
          category: magi-trace
      # CodeQL's security results describe possible vulnerabilities, and artifacts of a public
      # repository can be downloaded by anyone signed in to GitHub: they never leave the job.
      # Their counts stay in the run summary (index.md).
      - name: Keep security results out of the artifact
        if: always()
        run: |
          rm -f analysis/security.md analysis/security.json analysis/security.sarif
          if [ -f analysis/findings.json ]; then
            node -e 'const f="analysis/findings.json",fs=require("fs"),t=JSON.parse(fs.readFileSync(f));t.findings=t.findings.filter(x=>x.kind!=="sec.result");fs.writeFileSync(f,JSON.stringify(t,null,1))'
          fi
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trace
          path: |
            analysis/
            !analysis/.codeql-db/
            !analysis/previous/
          retention-days: 30

  trace-publish:
    # Pushes the trace's reports (security results already removed) to the `trace` branch,
    # one commit per scanned commit of main; MAGI DEV's scan job fetches them from there.
    # The only job with write access to the repository: it runs none of the repository's code,
    # only git on the downloaded reports, and pushes only the `trace` branch.
    name: Publish the trace
    needs: [trace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: trace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trace
          path: reports
      - name: Push to the trace branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -e reports/security.md ] || [ -e reports/security.sarif ]; then
            echo "::error::security results in the reports; refusing to publish"; exit 1
          fi
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          URL="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c http.extraheader="$AUTH" clone --quiet --depth 1 --branch trace "$URL" pub; then :
          else git init --quiet pub && git -C pub checkout --quiet --orphan trace && git -C pub remote add origin "$URL"; fi
          find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r reports/. pub/
          cd pub
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "trace of ${GITHUB_SHA}" || { echo "no change"; exit 0; }
          git -c http.extraheader="$AUTH" push --quiet origin trace

  deploy-control-plane:
    name: Deploy control plane (dev)
    needs: [changes, verify, semgrep, dependencies, secrets, workflows-and-shell, data-factory-python]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.control == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_control)
    uses: ./.github/workflows/deploy-control-plane.yml
    secrets:
      FLY_API_TOKEN_CI: ${{ secrets.FLY_API_TOKEN_CI }}

  build-execution-image:
    name: Build execution plane image (dev)
    # Runs after the control-plane deploy (or its skip): its last step pins FLY_MISSIONS_IMAGE on the
    # control-plane machine, which needs the same machine lease `flyctl deploy` holds — running the
    # two in parallel made the pin fail with "lease currently held" and left the secret staged.
    needs: [changes, verify, semgrep, dependencies, secrets, workflows-and-shell, data-factory-python, deploy-control-plane]
    if: >-
      !cancelled() &&
      (needs.deploy-control-plane.result == 'success' || needs.deploy-control-plane.result == 'skipped') &&
      needs.verify.result == 'success' && needs.semgrep.result == 'success' &&
      needs.dependencies.result == 'success' && needs.secrets.result == 'success' &&
      needs.workflows-and-shell.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.execution == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.build_execution))
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/build-execution-image.yml
    secrets:
      FLY_API_TOKEN_CI: ${{ secrets.FLY_API_TOKEN_CI }}
