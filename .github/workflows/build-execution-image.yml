name: Build execution plane image

# Reusable: called by quality.yml after every gate passes on a push to main that touched the
# execution plane. Pins the control plane to the exact image just built — the same policy
# scripts/deploy-missions.sh uses — so no path ever relies on the floating :latest tag.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build-dev:
    name: Build & push (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Authenticate with Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CI }}

      - name: Build and push image
        run: |
          docker build \
            -f packages/agent-runtime-worker/Dockerfile \
            -t registry.fly.io/magi-missions-dev:latest \
            -t registry.fly.io/magi-missions-dev:${{ github.sha }} \
            .
          docker push registry.fly.io/magi-missions-dev:latest
          docker push registry.fly.io/magi-missions-dev:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CI }}

      # Pin the control plane to this exact build (restarts it). Failure here is a real failure:
      # an earlier version ran `secrets unset ... || true`, which silently undid the pin
      # deploy-missions.sh sets and hid its own errors.
      - name: Pin FLY_MISSIONS_IMAGE on the control plane to this build
        # Retries: setting a secret restages the control-plane machine and needs its lease, which a
        # concurrent deploy may hold for a minute. A failure after the retries leaves the secret
        # "Staged" — `flyctl secrets deploy --app magi-control-dev` applies it by hand.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if flyctl secrets set "FLY_MISSIONS_IMAGE=registry.fly.io/magi-missions-dev:${{ github.sha }}" --app magi-control-dev; then
              exit 0
            fi
            echo "secrets set failed (attempt $attempt/6) — retrying in 20s"
            sleep 20
          done
          echo "::error::FLY_MISSIONS_IMAGE could not be pinned; run: flyctl secrets deploy --app magi-control-dev"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CI }}
