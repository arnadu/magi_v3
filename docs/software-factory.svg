<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-label="The MAGI factory: users and the product owner feed planning; building, local checks, a change proposal, CI gates, agent review and the owner's decision lead to staging, rollout and production on Fly; monitoring feeds support, which feeds planning. Checks and production monitoring are built; building, proposing, staging, rollout and support by agents are planned.">
        <style>
  .bg { fill: #ffffff; }
  .box { stroke-width: 2; }
  .b { fill: #e3f2ec; stroke: #23805f; }
  .p { fill: #f8eedb; stroke: #b5780f; }
  .n { fill: #eceef2; stroke: #7d879a; stroke-dasharray: 6 4; }
  .id { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #5b6475; }
  .t { font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #18202e; }
  .s { font-family: "IBM Plex Sans", Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #5b6475; }
  .flow { stroke: #18202e; stroke-width: 1.5; fill: none; }
  .loop { stroke: #2f55c8; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  .ll { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #2f55c8; }
  .zone { fill: none; stroke: #d9dde5; stroke-width: 1.5; stroke-dasharray: 2 4; }
  .zl { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5b6475; letter-spacing: 0.06em; }
  .lg { font-family: "IBM Plex Sans", Arial, Helvetica, sans-serif; font-size: 12px; fill: #5b6475; }
</style>
        <rect class="bg" x="0" y="0" width="1200" height="840"/>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18202e"/></marker>
          <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f55c8"/></marker>
        </defs>

        <!-- zones -->
        <rect class="zone" x="20" y="208" width="1160" height="196" rx="10"/>
        <text class="zl" x="34" y="226">THE CHANGE LINE · MAGI DEV'S OWN INSTALLATION (PREVIOUS STABLE RELEASE)</text>
        <rect class="zone" x="20" y="570" width="1160" height="210" rx="10"/>
        <text class="zl" x="34" y="588">RUNNING MAGI · FLY.IO · WHERE YOUR MISSIONS LIVE</text>

        <!-- row 1: intake -->
        <rect class="box p" x="40" y="40" width="230" height="100" rx="8"/>
        <text class="id" x="54" y="62">A</text><text class="t" x="72" y="62">Users &amp; operators</text>
        <text class="s" x="54" y="86">You and a beta tester run missions;</text>
        <text class="s" x="54" y="102">feedback via copilots and issues</text>
        <text class="s" x="54" y="124">Aim: community intake (G)</text>

        <rect class="box p" x="340" y="40" width="230" height="100" rx="8"/>
        <text class="id" x="354" y="62">B</text><text class="t" x="372" y="62">Sponsor &amp; product owner</text>
        <text class="s" x="354" y="86">You: vision, audits, the catalog;</text>
        <text class="s" x="354" y="102">decides with Claude Code today</text>
        <text class="s" x="354" y="124">Aim: decisions inbox (E)</text>

        <rect class="box p" x="640" y="40" width="250" height="100" rx="8"/>
        <text class="id" x="654" y="62">C</text><text class="t" x="672" y="62">Plan &amp; prioritise</text>
        <text class="s" x="654" y="86">Roadmap, GitHub issues, catalog;</text>
        <text class="s" x="654" y="102">Claude Code drafts, you approve</text>
        <text class="s" x="654" y="124">Aim: a planning agent (phase 1)</text>

        <rect class="box b" x="960" y="40" width="200" height="100" rx="8"/>
        <text class="id" x="974" y="62">S</text><text class="t" x="992" y="62">The spec</text>
        <text class="s" x="974" y="86">Product &amp; architecture catalog,</text>
        <text class="s" x="974" y="102">OpenAPI files, threat model,</text>
        <text class="s" x="974" y="118">attack matrix — all checked</text>

        <!-- row 2: change line -->
        <rect class="box p" x="40" y="250" width="170" height="120" rx="8"/>
        <text class="id" x="54" y="272">D</text><text class="t" x="72" y="272">Build</text>
        <text class="s" x="54" y="296">Claude Code with you;</text>
        <text class="s" x="54" y="312">no agent writes code yet</text>
        <text class="s" x="54" y="352">Aim: agent builders (D, B)</text>

        <rect class="box b" x="236" y="250" width="150" height="120" rx="8"/>
        <text class="id" x="250" y="272">E</text><text class="t" x="268" y="272">Local checks</text>
        <text class="s" x="250" y="296">pre-commit lint,</text>
        <text class="s" x="250" y="312">pre-push verify,</text>
        <text class="s" x="250" y="328">sandbox, local stack</text>

        <rect class="box n" x="412" y="250" width="150" height="120" rx="8"/>
        <text class="id" x="426" y="272">F</text><text class="t" x="444" y="272">Propose</text>
        <text class="s" x="426" y="296">Today: commit to main</text>
        <text class="s" x="426" y="312">Aim: pull request</text>
        <text class="s" x="426" y="328">via the git proxy (B)</text>

        <rect class="box b" x="588" y="250" width="170" height="120" rx="8"/>
        <text class="id" x="602" y="272">G</text><text class="t" x="620" y="272">Gates (CI)</text>
        <text class="s" x="602" y="296">~25 automated checks;</text>
        <text class="s" x="602" y="312">each proven able to fail;</text>
        <text class="s" x="602" y="328">a red gate stops deploy</text>

        <rect class="box p" x="784" y="250" width="170" height="120" rx="8"/>
        <text class="id" x="798" y="272">H</text><text class="t" x="816" y="272">Review</text>
        <text class="s" x="798" y="296">Claude Code's reviews;</text>
        <text class="s" x="798" y="312">MAGI DEV documenter;</text>
        <text class="s" x="798" y="328">report gate on every report</text>

        <rect class="box p" x="980" y="250" width="180" height="120" rx="8"/>
        <text class="id" x="994" y="272">I</text><text class="t" x="1012" y="272">Decide &amp; merge</text>
        <text class="s" x="994" y="296">You, in conversation;</text>
        <text class="s" x="994" y="312">push to main = deploy dev</text>
        <text class="s" x="994" y="352">Aim: merge on approval (E)</text>

        <!-- row 3: staging -->
        <rect class="box n" x="980" y="430" width="180" height="110" rx="8"/>
        <text class="id" x="994" y="452">J</text><text class="t" x="1012" y="452">Staging</text>
        <text class="s" x="994" y="476">A full MAGI stack for</text>
        <text class="s" x="994" y="492">release candidates (C);</text>
        <text class="s" x="994" y="508">today: dev is the test bed</text>

        <!-- row 4: running -->
        <rect class="box p" x="980" y="610" width="180" height="140" rx="8"/>
        <text class="id" x="994" y="632">K</text><text class="t" x="1012" y="632">Rollout</text>
        <text class="s" x="994" y="656">CI deploys dev, pins image;</text>
        <text class="s" x="994" y="672">promote.sh for beta;</text>
        <text class="s" x="994" y="688">missions update on resume</text>
        <text class="s" x="994" y="730">Aim: canary + rollback (F)</text>

        <rect class="box b" x="740" y="610" width="200" height="140" rx="8"/>
        <text class="id" x="754" y="632">L</text><text class="t" x="772" y="632">Production</text>
        <text class="s" x="754" y="656">Control plane, apps host,</text>
        <text class="s" x="754" y="672">one machine per mission;</text>
        <text class="s" x="754" y="688">dev (your missions), beta</text>

        <rect class="box b" x="430" y="610" width="270" height="140" rx="8"/>
        <text class="id" x="444" y="632">M</text><text class="t" x="462" y="632">Monitoring &amp; alerts</text>
        <text class="s" x="444" y="656">Anomalies, machine-down, OOM,</text>
        <text class="s" x="444" y="672">disk, spend, Atlas, scheduler stall;</text>
        <text class="s" x="444" y="688">daily resource report</text>
        <text class="s" x="444" y="730">Aim: out-of-band alerts (G-5)</text>

        <rect class="box p" x="40" y="610" width="350" height="140" rx="8"/>
        <text class="id" x="54" y="632">N</text><text class="t" x="72" y="632">Support &amp; triage</text>
        <text class="s" x="54" y="656">The control copilot diagnoses (reads Fly</text>
        <text class="s" x="54" y="672">exits and logs); you act on its proposals</text>
        <text class="s" x="54" y="712">Aim: a production support agent reading</text>
        <text class="s" x="54" y="728">production through the Ops API (A)</text>

        <!-- main flows -->
        <g>
          <line class="flow" x1="270" y1="90" x2="336" y2="90" marker-end="url(#ah)"/>
          <line class="flow" x1="570" y1="90" x2="636" y2="90" marker-end="url(#ah)"/>
          <line class="flow" x1="956" y1="90" x2="894" y2="90" marker-end="url(#ah)"/>
          <path class="flow" d="M700,140 V182 H125 V246" marker-end="url(#ah)"/>
          <text class="s" x="300" y="176">work items</text>
          <line class="flow" x1="210" y1="310" x2="232" y2="310" marker-end="url(#ah)"/>
          <line class="flow" x1="386" y1="310" x2="408" y2="310" marker-end="url(#ah)"/>
          <line class="flow" x1="562" y1="310" x2="584" y2="310" marker-end="url(#ah)"/>
          <line class="flow" x1="758" y1="310" x2="780" y2="310" marker-end="url(#ah)"/>
          <line class="flow" x1="954" y1="310" x2="976" y2="310" marker-end="url(#ah)"/>
          <line class="flow" x1="1070" y1="370" x2="1070" y2="426" marker-end="url(#ah)"/>
          <line class="flow" x1="1070" y1="540" x2="1070" y2="606" marker-end="url(#ah)"/>
          <line class="flow" x1="980" y1="680" x2="944" y2="680" marker-end="url(#ah)"/>
          <line class="flow" x1="740" y1="680" x2="704" y2="680" marker-end="url(#ah)"/>
          <line class="flow" x1="430" y1="680" x2="394" y2="680" marker-end="url(#ah)"/>
        </g>

        <!-- loops -->
        <path class="loop" d="M870,370 V392 H100 V374" marker-end="url(#al)"/>
        <text class="ll" x="400" y="388">LOOP 1 · a gate or a reviewer sends the change back</text>
        <path class="loop" d="M980,500 H180 V374" marker-end="url(#al)"/>
        <text class="ll" x="400" y="494">LOOP 2 · staging or an attack run sends it back</text>
        <path class="loop" d="M40,690 H10 V196 H660 V144" marker-end="url(#al)"/>
        <text class="ll" x="27" y="556" transform="rotate(-90 27 556)">LOOP 3 · incidents</text>
      
        <rect class="box b" x="40" y="812" width="22" height="12" rx="3"/><text class="lg" x="70" y="823">Built: works today</text>
        <rect class="box p" x="220" y="812" width="22" height="12" rx="3"/><text class="lg" x="250" y="823">Partial: a person still does the job</text>
        <rect class="box n" x="480" y="812" width="22" height="12" rx="3"/><text class="lg" x="510" y="823">Planned: on the roadmap</text>
        <line class="loop" x1="700" y1="818" x2="734" y2="818"/><text class="lg" x="742" y="823">Feedback loop</text>
        <text class="lg" x="900" y="823">Status as of 2026-11-24</text>
      </svg>
