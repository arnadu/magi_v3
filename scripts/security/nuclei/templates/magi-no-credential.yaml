id: magi-no-credential

info:
  name: An operator route answers without a credential
  author: magi
  severity: high
  description: A sample of operator routes, asked with no credential, must answer 401 (sec.authenticated).
  tags: magi,magi-auth

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/missions"
      - "{{BaseURL}}/api/missions/{{alice_mission}}"
      - "{{BaseURL}}/api/auth/me"
      - "{{BaseURL}}/api/copilot/history"
      - "{{BaseURL}}/api/copilot/files"
      - "{{BaseURL}}/missions/{{alice_mission}}/status"
    stop-at-first-match: false
    matchers:
      - type: dsl
        name: not-refused
        dsl:
          - "status_code != 401"
